# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
  pull_request:

env:
  DATABASE_TYPE: postgresql
  SKIP_DB_CHECK: 1

jobs:
  build:
    # Fixed: this condition checked the upstream project's name
    # (umami-software/umami), so it silently skipped on every run in this
    # fork and the "CI" here has never actually executed.
    if: github.repository == 'Suwebatu-Limited/umami_DPS_Analytics'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
        - node-version: 18.18
          pnpm-version: 10
          db-type: postgresql
        - node-version: 18.18
          pnpm-version: 10
          db-type: mysql

    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4 # required so that setup-node will work
      with:
        version: ${{ matrix.pnpm-version }}
        run_install: false
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
      env:
        DATABASE_TYPE: ${{ matrix.db-type }}
    # This used to be followed by `npm install --global pnpm`, with no
    # version pin - that silently overrode the matrix's pnpm-version (10)
    # with whatever npm currently resolves as "latest" (12.8.1 as of this
    # fix), which is why every onlyBuiltDependencies/ignoredBuiltDependencies
    # config change kept having zero effect: the pnpm version actually
    # running the install was never the one being configured for. Confirmed
    # live from the install log itself (content-addressable store format
    # v11, not the v10 pnpm/action-setup actually provisions). The step
    # pnpm/action-setup already does is the real version; nothing after it
    # should reinstall pnpm.
    - run: pnpm install
    - run: pnpm test
    - run: pnpm build

  # Aggregates the build matrix into one status check the org-wide ruleset
  # can require by name. if: always() so this still runs if build failed -
  # a skipped required check reads as passing to GitHub, which would defeat
  # the point.
  ci-complete:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job above to have succeeded or been skipped on purpose
        run: |
          for result in "${{ needs.build.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required job did not succeed."
              exit 1
            fi
          done
